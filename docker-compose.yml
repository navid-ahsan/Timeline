services:

  # ── Ollama: local LLM inference ────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ls_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ── Pull models once on first startup ─────────────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: ls_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/init_models.sh:/init_models.sh
    entrypoint: ["/bin/sh", "/init_models.sh"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-mistral}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
    restart: "no"

  # ── PostgreSQL + pgvector ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ls_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-lastensuojelu_db}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-lastensuojelu_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Application: LangGraph pipeline + Streamlit UI ────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ls_app
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-lastensuojelu_db}
      LLM_MODEL: ${LLM_MODEL:-mistral}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8501:8501"

volumes:
  ollama_data:
  pgdata:
